[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "privaparse"
version = "0.1.0"
description = "Local privacy layer: detect PII, replace with deterministic placeholders, restore after LLM response."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

dependencies = [
    "typer>=0.12",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "phonenumbers>=8.13",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Milestone D pulls this in. Milestones A-C run without it.
model = ["gliner2[local]>=1.3.2"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
privaparse = "privaparse.app.main:app"

[tool.setuptools.packages.find]
include = ["privaparse*"]

[tool.setuptools.package-data]
privaparse = ["app/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "model: requires GLiNER2 weights on disk (slow, needs `pip install -e .[model]`)",
]
addopts = "-m 'not model'"

[tool.ruff]
line-length = 100
target-version = "py311"
