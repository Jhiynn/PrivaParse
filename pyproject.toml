[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "privaparse"
version = "0.1.0"
description = "Local privacy layer: detect PII, replace with deterministic placeholders, restore after LLM response."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

dependencies = [
    "typer>=0.12",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "phonenumbers>=8.13",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Milestone D pulls this in. Milestones A-C run without it.
model = ["gliner2[local]>=1.3.2"]
gateway = ["starlette>=0.37", "uvicorn>=0.30", "httpx>=0.27"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.16",
]

[project.scripts]
privaparse = "privaparse.app.main:app"

[tool.setuptools.packages.find]
include = ["privaparse*"]

[tool.setuptools.package-data]
privaparse = ["app/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "model: requires GLiNER2 weights on disk (slow, needs `pip install -e .[model]`)",
]
addopts = "-m 'not model'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Pinned explicitly rather than inherited. Ruff's defaults widen between
# releases, and a public repo whose CI reddens because a linter shipped a new
# rule teaches contributors to distrust the badge.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "C4", "ISC", "PYI", "PLE", "PLW", "S", "BLE", "RUF"]
ignore = [
    # This project's source and gold data are German. RUF001-003 flag German
    # orthography as "ambiguous unicode", which is a false positive here by
    # construction, not a defect to fix.
    "RUF001", "RUF002", "RUF003",
    # `[*xs, x]` versus `xs + [x]`. Style, no defect.
    "RUF005",
    # Deferred, not dismissed: exception chaining would improve tracebacks
    # across 5 sites, but it is unrelated to making this repository public.
    "B904",
    # `strict=` changes what zip does at runtime -- it raises on a length
    # mismatch where today it truncates. This change is not permitted to alter
    # behaviour, so the rule cannot be adopted in it.
    "B905",
]

[tool.ruff.lint.flake8-bugbear]
# Typer's entire API is `def command(x: str = typer.Option(...))`. B008 is
# right about mutable defaults in general and wrong about this framework;
# this is the documented way to say so, rather than a blanket noqa.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.per-file-ignores]
# Assertions and subprocess calls are the point of a test suite.
"tests/**" = ["S101", "S603", "S607"]
"eval/**" = ["S101", "S603", "S607"]
