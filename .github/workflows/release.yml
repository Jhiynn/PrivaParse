name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # CI's `push` trigger only fires on `branches: [main]`, so a `v*` tag runs
  # no checks of its own. This is the last gate on the exact commit being
  # tagged before `build` packages it -- CI already covers the breadth
  # (matrix of OS/Python versions), so one leg here is a sanity check, not a
  # second CI.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev,gateway]"
      - run: ruff check .
      - run: pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Requires the maintainer's approval before the upload runs. A PyPI
    # version number cannot be reused, so a mistyped tag is permanent; one
    # click is cheap insurance.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  # A tag alone leaves the repository's Releases page empty, which is where
  # most readers look first -- v0.1.0 had to be written by hand afterwards.
  # This runs after the upload so a release is never announced for a version
  # that failed to publish.
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            dist/*
