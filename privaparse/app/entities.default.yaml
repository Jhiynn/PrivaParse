# The shipped entity catalogue.
#
# A user file (PRIVAPARSE_ENTITIES, ./privaparse.entities.yaml, or
# ~/.config/privaparse/entities.yaml) is deep-merged ONTO this one. To remove a
# type, set `enabled: false` — omitting it here changes nothing.
#
# 38 of the 42 labels documented by fastino/gliner2-privacy-filter-PII-multi
# are routed below, onto 25 placeholder types — but only 21 of those types are
# currently enabled (CITY, REGION, COUNTRY and DATE are disabled; see each
# type's own comment). The other four labels are not routed at all: the
# per-label sweep measured every label alone against the full gold set, and
# each of those four found zero gold entities — see the removal note on each
# one's former type (PERSON, ACCOUNT_ID, SECRET twice) and
# docs/benchmarks/labels.md for the full sweep. MODEL_LABELS in catalogue.py
# still lists all 42; that constant documents what the model offers, not
# what this file chooses to send.
# Granularity errs high on purpose: merging two types later is a migration
# that rewrites a column and de-duplicates rows, which is mechanical.
# Splitting one type into two later is not possible without re-detecting
# every stored value, because the information that would separate them was
# discarded at write time. SECRET is the deliberate exception — it merges
# three labels because every one of them is irreversible, never restored, and
# never distinguished by anything downstream.
#
# Thresholds below are a mix of two things, and each type's own comment says
# which: a conservative starting point never yet measured (most types with no
# gold coverage — see eval/gold/de_gold_source.md), or a value read off the
# threshold sweep against the extended gold set. Five types carry an explicit
# value from that sweep (DATE_OF_BIRTH, ADDRESS, POSTAL_CODE, NATIONAL_ID,
# ACCOUNT_ID). Three carry the sweep's evidence in a comment but no explicit
# value, because the evidence itself argues against pinning one — PERSON and
# PHONE because the value that would be pinned equals the code default
# anyway, TAX_ID because no threshold changes its outcome at all. See each of
# those three's own comment. A type with no comment citing a measured number
# has not been measured at all — that silence is intentional, not an
# oversight, so it is not restated on every type.
#
# The sweep has a real limitation, worth stating here rather than leaving a
# reader to find it: it varies one shared, uniform threshold across every
# type at once, while the values below give each type its own — those are
# different experiments. POSTAL_CODE is the proof: the sweep itself reports
# 0.750 precision at 0.5, but the shipped configuration (POSTAL_CODE at 0.6,
# every other measured type at its own value) reports 0.600 at that same
# nominal threshold — because whether a competing type's span survives or
# dies at *its own* threshold changes what an overlap resolves to, and a
# single-variable sweep cannot see that interaction. So every value below is
# the best point found by moving one type's threshold while every other type
# moved with it, not an optimum over the full vector of per-type thresholds
# as they actually ship. Re-sweeping one type at a time against the other 20-
# odd held fixed at what ships would measure the thing this file actually
# needs; nothing here does that yet.
#
# Multi-word type names keep their underscore (NATIONAL_ID, not NATIONALID) so
# they still read as words in a model prompt. PLACEHOLDER_RE's type group
# allows underscores for exactly this reason; the split from the suffix stays
# unambiguous because the suffix grammar never contains one, so the *last*
# underscore in a rendered placeholder is always the real separator. See
# PLACEHOLDER_RE's own comment in database/placeholder.py for the worked case.
version: 1

placeholder_types:
  PERSON:
    # middle_name dropped (the per-label sweep): measured alone against the
    # 99 gold PERSON entities it found none, and it cost nothing either — 0
    # found, 0 noise. Silent, not borderline; see docs/benchmarks/labels.md
    # for the full per-label sweep this and the other three removals rest
    # on.
    labels: [person, full_name, first_name, last_name]
    prompts:
      person: "Vor- und Nachnamen von Menschen, auch mit Titeln wie Dr. oder Prof."
      full_name: "Vollstaendige Namen einer Person"
      first_name: "Vorname einer Person"
      last_name: "Nachname einer Person"
    normalizer: person
    sweep: word
    # Measured, not pinned: precision/recall hold flat at 0.973/0.961 from
    # 0.3 to 0.5; at 0.6 precision drops to 0.800. That is evidence the code
    # default (0.5, used when a type declares none) already sits at the
    # knee of the curve — not a reason to write threshold: 0.5 here. A
    # pinned value identical to the default would change nothing about what
    # gets detected while silently blocking --threshold from ever reaching
    # this type again; see --threshold's own help text and doctor's
    # threshold line for what "fallback" means in practice.
    reversible: true
    enabled: true
    bar: { precision: 0.85, recall: 0.90 }

  EMAIL:
    labels: [email]
    prompts:
      email: "E-Mail-Adressen"
    normalizer: email
    validator: builtin:email_syntax
    backstop: builtin:email
    sweep: icase
    reversible: true
    enabled: true
    bar: { precision: 0.95, recall: 0.95 }

  PHONE:
    labels: [phone_number]
    prompts:
      phone_number: "Telefon- und Mobilnummern, auch mit Landesvorwahl"
    normalizer: phone
    validator: builtin:phone_shape
    backstop: builtin:phone
    sweep: exact
    # Measured precision 0.818 (not the 0.857 an earlier pass reported —
    # that number predates de-047's bare Steuer-ID being restored to the
    # gold set). Flat across the sweep regardless: the false positives are
    # not model spans a threshold could filter out — they come from the
    # phone backstop's own shape check colliding with an unrelated digit
    # string (a Steuer-ID written without separators reads as an eleven-
    # digit German mobile number; eval/gold/de_gold_source.md's de-047
    # keeps one on purpose so this stays visible). No threshold value
    # touches a backstop span, so none is pinned here — pinning one would
    # only block --threshold from this type while fixing nothing; see
    # --threshold's own help text and doctor's threshold line.
    reversible: true
    enabled: true
    bar: { precision: 0.95, recall: 0.95 }

  DATE_OF_BIRTH:
    labels: [date_of_birth]
    prompts: {date_of_birth: "Geburtsdatum einer Person"}
    normalizer: date_iso
    sweep: exact
    # 1.000/1.000 from 0.7 up. 0.7 is the cheapest point that reaches it —
    # no reason to push higher and lose margin for nothing.
    threshold: 0.7

  ADDRESS:
    labels: [address, street_address]
    prompts:
      address: "Vollstaendige Anschrift mit Strasse, Hausnummer und Ort"
      street_address: "Strasse und Hausnummer"
    normalizer: casefold
    sweep: word
    # 0.750/1.000 at 0.9; 0.600 from 0.6 to 0.8; 0.429 below that. No
    # validator exists for ADDRESS (no decidable rule for what a street
    # address is), so the threshold is the only precision lever this type
    # has.
    threshold: 0.9

  CITY:
    labels: [city]
    prompts: {city: "Staedte und Gemeinden"}
    normalizer: casefold
    sweep: "off"
    threshold: 0.7
    # Disabled — project owner's call, on evidence: 13 false positives, 0
    # true positives on the threshold sweep's gold set (91 documents).
    # de-006 is the worked example: a document about a company's sales
    # network gets Frankfurt, Hamburg and Leipzig masked, and a city name
    # does not identify a person. Set enabled: true to turn it back on;
    # nothing else needs to change, and this note stays so the next person
    # re-decides from the same evidence rather than from a guess about why
    # it's off.
    enabled: false

  REGION:
    labels: [state_or_region]
    prompts: {state_or_region: "Bundeslaender, Regionen, Kantone"}
    normalizer: casefold
    sweep: "off"
    threshold: 0.7
    # Disabled alongside CITY, COUNTRY and DATE — project owner's call, on
    # this type's own evidence: 4 false positives (state_or_region), 0 true
    # positives, on the threshold sweep's gold set. de-006 (a company's
    # sales network across Bayern, Sachsen and Nordrhein-Westfalen) is the
    # same worked example CITY's note points to. A region does not identify
    # a person either.
    enabled: false

  POSTAL_CODE:
    labels: [postal_code]
    prompts: {postal_code: "Postleitzahlen"}
    normalizer: digits
    validator: builtin:postal_de
    sweep: exact
    # 0.750/1.000 flat from 0.3 to 0.6; 0.600 from 0.7 up. postal_de already
    # vetoes anything that is not five digits, so the validator is doing
    # the precision work here — 0.6 sits inside the flat stretch, not at a
    # point that fixes anything on its own.
    threshold: 0.6

  COUNTRY:
    labels: [country]
    prompts: {country: "Laendernamen"}
    normalizer: casefold
    sweep: "off"
    threshold: 0.8
    # Disabled alongside CITY, REGION and DATE, but on different grounds:
    # COUNTRY measured 0 false positives as well as 0 true positives on the
    # threshold sweep's gold set, so disabling it is not something the
    # measurement argues for — the corpus simply never gave the model a
    # country name to get wrong. This rests on judgement instead: a country
    # name on its own rarely identifies a person, unlike the other three,
    # which each have an actual false-positive count behind the decision.
    # Re-decide this one from that judgement, not from evidence this sweep
    # does not have.
    enabled: false

  NATIONAL_ID:
    labels: [government_id, national_id_number]
    prompts:
      government_id: "Amtliche Ausweis- und Identifikationsnummern"
      national_id_number: "Nationale Identifikationsnummer"
    normalizer: strip_upper
    sweep: exact
    # 0.750/1.000 flat from 0.3 to 0.8; at 0.9 recall collapses to 0.333.
    # 0.7 keeps the same operating point with margin below that cliff.
    threshold: 0.7

  PASSPORT:
    labels: [passport_number]
    prompts: {passport_number: "Reisepassnummern"}
    normalizer: strip_upper
    sweep: exact
    threshold: 0.6

  DRIVERS_LICENSE:
    labels: [drivers_license_number]
    prompts: {drivers_license_number: "Fuehrerscheinnummern"}
    normalizer: strip_upper
    sweep: exact
    threshold: 0.6

  LICENSE_NUMBER:
    labels: [license_number]
    prompts: {license_number: "Lizenz- und Zulassungsnummern"}
    normalizer: strip_upper
    sweep: exact
    threshold: 0.7

  TAX_ID:
    labels: [tax_id, tax_number]
    prompts:
      tax_id: "Steuer-Identifikationsnummer"
      tax_number: "Steuernummer, Umsatzsteuer-Identifikationsnummer"
    normalizer: strip_upper
    validator: builtin:tax_de
    backstop: builtin:vat_de
    sweep: exact
    # Recall measures 0.000 at every threshold from 0.3 to 0.9 — a
    # detection gap, not a knob. The model does not reliably tag the
    # official grouped Steuer-ID presentation ("XX XXX XXX XXX") as tax_id
    # in the first place, so no threshold recovers a span it never
    # proposed. No value is pinned here for the same reason as PERSON and
    # PHONE: it would block --threshold from reaching this type while
    # fixing nothing. See the note on is_valid_tax_de in validators.py: its
    # Steuer-ID checksum branch is already inert (the Steuernummer branch
    # accepts any 10-11 digit value regardless), and this recall gap is the
    # argument for splitting TAX_ID rather than tuning it further here.

  ACCOUNT_NUMBER:
    labels: [bank_account, account_number]
    prompts:
      bank_account: "Bankkontonummern"
      account_number: "Kontonummern"
    normalizer: strip_upper
    sweep: exact
    threshold: 0.6

  ROUTING_NUMBER:
    labels: [routing_number]
    prompts: {routing_number: "Bankleitzahlen, BIC, Routing-Nummern"}
    # strip_upper, not digits: the validator now accepts a BIC as well as a
    # BLZ, and a BIC's letters are the bank and country code, not noise —
    # normalizer: digits would strip "DEUTDEFF" to "" (dropped entirely) and
    # "DEUTDEFF500" to "500" (colliding with any other BIC sharing that
    # trailing digit run).
    normalizer: strip_upper
    validator: builtin:bank_routing_de
    sweep: exact
    threshold: 0.6

  IBAN:
    labels: [iban]
    prompts: {iban: "IBAN-Kontonummern"}
    normalizer: strip_upper
    validator: builtin:iban_mod97
    backstop: builtin:iban
    sweep: exact
    threshold: 0.5
    bar: { precision: 0.95, recall: 0.95 }

  CARD:
    labels: [payment_card, card_number]
    prompts:
      payment_card: "Kreditkarten- und Zahlungskartennummern"
      card_number: "Kartennummern"
    normalizer: digits
    validator: builtin:luhn
    backstop: builtin:card
    sweep: exact
    threshold: 0.5
    reversible: false
    bar: { precision: 0.95, recall: 0.95 }

  CARD_EXPIRY:
    labels: [card_expiry]
    prompts: {card_expiry: "Gueltigkeitsdatum einer Zahlungskarte"}
    # date_iso only recognises a three-part date, so "08/27" falls through
    # to its casefold fallback — and "08/27", "08-27" and "08 / 27" then
    # casefold to three different strings for one expiry. expiry needs its
    # own normalizer, matching what expiry_shape actually accepts.
    normalizer: expiry
    validator: builtin:expiry_shape
    sweep: exact
    threshold: 0.6

  CARD_CVV:
    labels: [card_cvv]
    prompts: {card_cvv: "Kartenpruefnummer, CVV, CVC"}
    normalizer: digits
    validator: builtin:cvv_shape
    sweep: exact
    threshold: 0.6
    reversible: false
    # Stays enabled despite 8 measured false positives (0 true positives in
    # this gold set — a 3-4 digit number has no gold coverage of a real CVV
    # to compare against, so recall is unmeasured, not known-zero, unlike
    # CITY/REGION/COUNTRY/DATE above). A card verification value genuinely
    # warrants protection when the model is right, and cvv_shape is already
    # the only precision lever a bare 3-4 digit number can have — no gold
    # CARD_CVV data exists yet to say whether raising the threshold would
    # help without more evidence than this sweep produced.

  USERNAME:
    labels: [username]
    prompts: {username: "Benutzernamen und Anmeldenamen"}
    normalizer: casefold
    sweep: word
    threshold: 0.8

  IP:
    labels: [ip_address]
    prompts: {ip_address: "IPv4- und IPv6-Adressen"}
    normalizer: casefold
    validator: builtin:ip_parse
    backstop: builtin:ip
    sweep: exact
    threshold: 0.5

  ACCOUNT_ID:
    # sensitive_account_id dropped (the per-label sweep): measured alone
    # against the 3 gold ACCOUNT_ID entities it found none, and cost one
    # false positive — noise with no matching benefit. account_id alone now
    # carries the type's entire measured signal; see docs/benchmarks/labels.md.
    labels: [account_id]
    prompts:
      account_id: "Kunden-, Konto- und Mandantennummern"
    normalizer: casefold
    sweep: exact
    # 0.750/1.000 at 0.8 and 0.9; 0.600 below that. No validator exists for
    # this type — a customer number has no decidable shape separate from an
    # invoice or order number — so, like ADDRESS, the threshold is the only
    # lever available.
    threshold: 0.8

  SECRET:
    # secret and recovery_code dropped (the per-label sweep), each measured
    # alone against the 3 gold SECRET entities. secret found none and cost
    # nothing either — 0 found, 0 noise, silent. recovery_code found none
    # and cost one false positive — noise with no matching benefit. The
    # three labels that remain are not strong either (api_key finds one of
    # three with no noise; password and access_token each find one of
    # three and both carry noise of their own) — SECRET is the weakest
    # type this catalogue measures; see docs/benchmarks/labels.md.
    labels: [password, api_key, access_token]
    prompts:
      password: "Passwoerter"
      api_key: "API-Schluessel"
      access_token: "Zugriffstoken"
    normalizer: identity
    sweep: exact
    threshold: 0.8
    reversible: false

  DATE:
    labels: [sensitive_date, document_date, expiration_date, transaction_date]
    prompts:
      sensitive_date: "Datumsangaben, die eine Person betreffen"
      document_date: "Datum eines Dokuments"
      expiration_date: "Ablaufdatum"
      transaction_date: "Datum einer Transaktion"
    normalizer: date_iso
    sweep: exact
    threshold: 0.8
    # Disabled alongside CITY, REGION and COUNTRY — project owner's call,
    # on this type's own evidence: 19 false positives across its four
    # labels (transaction_date 14, expiration_date 5; sensitive_date and
    # document_date measured 0 each), 0 true positives on any of them. An
    # invoice date does not identify a person — DATE_OF_BIRTH is the type
    # that does, and it is unaffected by this.
    enabled: false
